<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="ForgeFit — modern gym management SaaS." />
    <title> Gym Management</title>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;background:#050505;color:#fff;display:grid;place-items:center;font-family:system-ui">Loading ForgeFit…</div></div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (root && !root.dataset.mounted) {
          root.innerHTML = '<div style="min-height:100vh;background:#050505;color:#fff;padding:40px;font-family:system-ui;display:grid;place-items:center"><div style="max-width:760px"><h1 style="margin:0 0 12px">ForgeFit startup error</h1><p style="color:#aaa;line-height:1.6">' + String(event.error?.message || event.message || "Unknown startup error").replace(/</g,"&lt;").replace(/>/g,"&gt;") + '</p><p style="color:#666;font-size:13px">Open browser DevTools → Console for the full error.</p></div></div>';
        }
      });
      window.addEventListener("unhandledrejection", function (event) {
        var root = document.getElementById("root");
        if (root && !root.dataset.mounted) {
          root.innerHTML = '<div style="min-height:100vh;background:#050505;color:#fff;padding:40px;font-family:system-ui;display:grid;place-items:center"><div style="max-width:760px"><h1 style="margin:0 0 12px">ForgeFit startup error</h1><p style="color:#aaa;line-height:1.6">' + String(event.reason?.message || event.reason || "Unknown startup error").replace(/</g,"&lt;").replace(/>/g,"&gt;") + '</p></div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
